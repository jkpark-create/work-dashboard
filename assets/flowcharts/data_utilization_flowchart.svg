    <rect x="1335" y="172" width="180" height="62" rx="0" class="source"/>
    <text x="1425" y="197" text-anchor="middle" class="node-title">Global A/C</text>
    <text x="1425" y="220" text-anchor="middle" class="node-small">RFQ·Award/Lost</text>

