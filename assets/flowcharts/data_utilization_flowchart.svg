<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#333333"/>
    </marker>
    <style>
      .title { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; font-size: 34px; font-weight: 700; fill: #252525; }
      .subtitle { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; font-size: 16px; fill: #444444; }
      .lane-title { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; font-size: 22px; font-weight: 700; fill: #2b2b2b; }
      .node-title { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; font-size: 18px; font-weight: 700; fill: #2b2b2b; }
      .node-small { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; font-size: 13px; fill: #4f4f4f; }
      .tag { font-family: Arial, 'Apple SD Gothic Neo', sans-serif; font-size: 13px; font-weight: 700; fill: #445; }
      .lane { fill: #edf3ff; stroke: #5b8cff; stroke-width: 2; }
      .source { fill: #f7f3ff; stroke: #8f6cff; stroke-width: 1.6; }
      .process { fill: #eaf6ff; stroke: #2f86ff; stroke-width: 2; }
      .decision { fill: #fff8e8; stroke: #f0a020; stroke-width: 2; }
      .action { fill: #effaf3; stroke: #33a35c; stroke-width: 2; }
      .output { fill: #fff7e9; stroke: #ff9900; stroke-width: 2; }
      .support { fill: #fafafa; stroke: #aaa; stroke-width: 1.5; }
      .line { stroke: #333333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #555555; stroke-width: 2; fill: none; marker-end: url(#arrow); stroke-dasharray: 7 6; }
      .thin { stroke: #555555; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1900" height="1280" fill="#ffffff"/>
  <text x="950" y="54" text-anchor="middle" class="title">해외영업팀 데이터 활용 흐름도</text>
  <text x="950" y="84" text-anchor="middle" class="subtitle">데이터를 모으는 것이 목적이 아니라, CM 판단 → 현지 Action → 결과 추적으로 이어지게 한다</text>

  <!-- Lanes -->
  <rect x="40" y="115" width="1820" height="155" rx="0" class="lane"/>
  <text x="950" y="145" text-anchor="middle" class="lane-title">1. 데이터 소스: 선복·부킹·목표·운임·수익·현지 신호를 같은 권역 기준으로 모은다</text>

  <rect x="40" y="300" width="1820" height="135" rx="0" class="lane"/>
  <text x="950" y="330" text-anchor="middle" class="lane-title">2. 기준 정렬/갱신: 서로 다른 자료를 같은 Scope와 기준일로 맞춘다</text>

  <rect x="40" y="465" width="1820" height="205" rx="0" class="lane"/>
  <text x="950" y="495" text-anchor="middle" class="lane-title">3. CM 진단: 권역별로 무엇이 문제인지 먼저 판단한다</text>

  <rect x="40" y="700" width="1820" height="220" rx="0" class="lane"/>
  <text x="950" y="730" text-anchor="middle" class="lane-title">4. 판단 분기: 활용도와 수익성에 따라 다른 전략을 선택한다</text>

  <rect x="40" y="950" width="1820" height="165" rx="0" class="lane"/>
  <text x="950" y="980" text-anchor="middle" class="lane-title">5. 실행/반영: 현지 영업, 고객, 시스템, 보고로 연결한다</text>

  <rect x="40" y="1145" width="1820" height="95" rx="0" class="lane"/>
  <text x="950" y="1175" text-anchor="middle" class="lane-title">6. 피드백: 실행 결과를 다시 데이터와 기준으로 축적한다</text>

